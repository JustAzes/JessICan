name: Build and deploy GH Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize main builds and deployments; replace superseded PR builds.
concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Zola with checksum verification
        run: bash tools/install-zola.sh "$RUNNER_TEMP/zola"

      - name: Build site
        run: |
          output_dir=$(python3 tools/check-output-dir.py "$GITHUB_WORKSPACE" .tools/site)
          "$RUNNER_TEMP/zola/zola" build --output-dir "$output_dir" --force

      - name: Check pages and local assets
        run: python3 tools/check-site.py .tools/site

      - name: Upload tested site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: .tools/site
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 0

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out validation tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download tested site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: .tools/site
          digest-mismatch: error

      - name: Check downloaded pages and local assets
        run: python3 tools/check-site.py .tools/site

      # The existing Pages setting continues to serve the gh-pages branch.
      - name: Publish tested site to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .tools/site
          keep_files: false
          force_orphan: false
