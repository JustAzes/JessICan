# Build Zola and deploy GitHub Pages. The TCVM event card bundle is unpacked before the build.
on: push
name: Build and deploy GH Pages

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: checkout
        uses: actions/checkout@v3.0.0

      - name: Restore TCVM event cards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p static/img/elemente
          unzip -qo .github/element-cards/cards-web.zip -d static/img/elemente

      - name: build_and_deploy
        uses: shalzz/zola-deploy-action@v0.16.1-1
        env:
          PAGES_BRANCH: gh-pages
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
