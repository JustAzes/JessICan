name: Build and deploy GH Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize main builds and deployments; replace superseded PR builds.
concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Zola with checksum verification
        run: bash tools/install-zola.sh "$RUNNER_TEMP/zola"

      - name: Build site
        run: |
          output_dir=$(python3 tools/check-output-dir.py "$GITHUB_WORKSPACE" .tools/site)
          "$RUNNER_TEMP/zola/zola" build --output-dir "$output_dir" --force

      - name: Check pages and local assets
        run: python3 tools/check-site.py .tools/site

      - name: Upload tested site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: .tools/site
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 0

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out validation tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download tested site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: .tools/site
          digest-mismatch: error

      - name: Check downloaded pages and local assets
        run: python3 tools/check-site.py .tools/site

      # The existing Pages setting continues to serve the gh-pages branch.
      - name: Publish tested site to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .tools/site
          keep_files: false
          force_orphan: false

  validate-live:
    needs: deploy
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out live validation tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the published site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: .tools/site
          digest-mismatch: error

      # Pages publication is asynchronous after the gh-pages push. Wait for the
      # tested HTML and stylesheet, then compare every public file over HTTPS.
      - name: Wait for publication and verify all live files
        id: http_check
        run: |
          set -euo pipefail
          python3 tools/check-live-site.py \
            --build .tools/site --all-files \
            --cache-key "${{ github.sha }}" --wait-seconds 180 \
            --output .tools/live-http-results.json \
            2>&1 | tee .tools/live-http.log

      - name: Install pinned browser validation tools
        run: |
          set -euo pipefail
          test -x /usr/bin/google-chrome
          python3 -m venv .tools/browser-venv
          .tools/browser-venv/bin/python -m pip --disable-pip-version-check \
            --no-input install playwright==1.63.0

      # These browser checks only read production pages and assets. They test
      # contact validation locally in the browser and never submit the form.
      - name: Verify live navigation, form and both quizzes
        id: browser_check
        run: |
          set -euo pipefail
          .tools/browser-venv/bin/python tools/check-browser.py .tools/site \
            --live --chromium /usr/bin/google-chrome \
            --output .tools/live-browser-results.json \
            2>&1 | tee .tools/live-browser.log

      - name: Summarize live verification
        if: always()
        env:
          HTTP_OUTCOME: ${{ steps.http_check.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser_check.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          lines = ["## Production verification", "",
                   "Origin: https://tierheilpraxis-jessican.de", "",
                   f"HTTP and file comparison: {os.environ['HTTP_OUTCOME']}",
                   f"Browser checks: {os.environ['BROWSER_OUTCOME']}"]
          reports = (
              ("HTTP", Path(".tools/live-http-results.json")),
              ("Browser", Path(".tools/live-browser-results.json")),
          )
          for label, path in reports:
              if path.is_file():
                  report = json.loads(path.read_text())
                  lines.append("")
                  lines.append(f"{label} result summary:")
                  for key in ("expected_routes", "passed", "failed", "complete", "checks"):
                      if key in report:
                          lines.append(f"- {key}: {report[key]}")
          lines.extend(["", "Full JSON results and logs are attached as the live-verification artifact."])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Upload live verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-verification
          path: |
            .tools/live-*.json
            .tools/live-*.log
          if-no-files-found: warn
          retention-days: 7
